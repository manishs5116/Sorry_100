<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>100 Ways to Say Sorry ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>100 Ways to Say Sorry ❤️</h1>

        <p class="subtitle">
            Every apology comes from my heart.
        </p>

        <div class="wheel-container" id="wheelContainer">

            <div class="wheel" id="wheel"></div>

            <div class="messages-layer" id="messagesLayer"></div>

            <div class="center-message" id="centerMessage">
                I'm truly sorry ❤️
            </div>

        </div>

        <p class="counter" id="counter">0 / 100</p>
        <p class="hint" id="hint"></p>
        <button class="replay" id="replay">Read them again ❤️</button>

    </div>
<audio id="bgMusic" loop>
    <source src="background-song.mp3" type="audio/mpeg">
</audio>

<button id="enterBtn" class="enter-btn">
    Open My Message ❤️
</button>

    <script src="script.js"></script>

</body>
</html>
